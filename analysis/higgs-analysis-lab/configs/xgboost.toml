# XGBoost experiment using the existing 1% prepared cache.
[data]
release = "2025e-13tev-beta"
skim = "exactly4lep"
luminosity_fb = 36.6
fraction = 0.01
step_size = "100 MB"
weight_mode = "legacy_absolute"

[selection]
pt_min_gev = [20.0, 15.0, 10.0]

[training]
model = "xgboost"
folds = 5
seed = 42
threshold = 0.65
features = ["mz1", "mz2", "ptz1", "ptz2", "pt4l", "met", "jet_n"]

[statistics]
mass_window_gev = [110.0, 135.0]
background_fractional_systematic = 0.30
