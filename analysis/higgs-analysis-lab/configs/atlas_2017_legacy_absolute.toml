# ATLAS-2017-like fiducial selection on the inclusive 4lep skim, using the
# absolute-weight convention from the official Open Data HZZ tutorial:
#   L * 1000 / sum_of_weights * product(abs(weight_branch)).
[data]
release = "2025e-13tev-beta"
skim = "4lep"
luminosity_fb = 36.1
fraction = 1.0
step_size = "100 MB"
weight_mode = "legacy_absolute"

[selection]
mode = "atlas_2017_fiducial"
pt_min_gev = [20.0, 15.0, 10.0]
sort_leptons_by_pt = true
track_isolation_max = 0.15
electron_calo_isolation_max = 0.20
muon_calo_isolation_max = 0.30
retained_mass_range_gev = [80.0, 250.0]

[training]
model = "logistic_regression"
folds = 5
seed = 42
target_signal_efficiency = 0.80
threshold = 0.20
group_aware = false
group_column = "source_id"
nested_tuning = false
features = ["mz2", "scalar_pt_sum_z2", "dR_02", "mz1", "dR_z2", "dR_03", "pt4l", "dR_13", "dR_12", "theta2", "theta1", "pt_z1_l2", "Theta", "eta_z2_l1", "Phi1", "Phi", "eta_z1_l2", "met_phi", "jet_n", "met"]

[statistics]
mass_window_gev = [115.0, 130.0]
background_fractional_systematic = 0.30
